name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  scaffold:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify project contract
        run: |
          test -f AGENTS.md
          test -f PROJECT_STATUS.md
          test -f PRODUCT.md
          test -f openspec/config.yaml

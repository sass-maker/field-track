schema: spec-driven

context: |
  Product: Private employee location tracker for about 100 field employees.
  Clients: React Native Android employee collector plus an Astro web application with React islands for manager surfaces.
  Backend: Astro server endpoints on Cloudflare Workers with Cloudflare D1; ordinary HTTPS and dashboard polling, not WebSockets.
  Maps: MapLibre with OpenStreetMap-compatible tiles.
  Constraints: Low-end Android phones, intermittent 4G, continuous administrator-controlled collection, visible Android foreground notification, server-side retention policy, team-scoped manager access, audit logs, no real employee data in source.
  Repository: pnpm. Production deploys are manual.

rules:
  proposal:
    - Keep the MVP boundary and non-goals explicit.
    - State deploy, privacy, and dependency impacts.
  design:
    - Include a Mermaid diagram for the browser-to-API-to-dashboard data flow.
    - Explain Android foreground-service limits, offline recovery, status derivation, authorization, retention, and deletion.
  specs:
    - Use observable GIVEN/WHEN/THEN scenarios for happy paths, offline recovery, stale data, authorization, and deletion.
  tasks:
    - Order tasks into independently verifiable vertical slices.
    - Include the smallest relevant check after each slice.

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
